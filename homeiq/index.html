<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--ARTIFACT-START-->
<title>HomeIQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: pegboard workbench ground; inked paper panels pinned to it; one column on phones, two-column dashboard from 900px; floating tool-tray tab bar. */
:root{
  --board:#D2C2A1; --hole:rgba(70,52,28,.30);
  --paper:#F7F1E3; --paper-2:#EEE5D0; --rule:rgba(30,27,22,.12);
  --ink:#1E1B16; --ink-2:#5B5346; --edge:#1E1B16; --shadow:#1E1B16;
  --orange:#C94A17; --blue:#2A5BA6; --green:#2D6E45; --ochre:#B98207; --red:#BC3227;
  --on-accent:#FFF8EC; --sel:rgba(201,74,23,.13);
  --f-display:"Young Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-body:"Public Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --board:#191713; --hole:rgba(0,0,0,.55);
    --paper:#26231D; --paper-2:#2F2B24; --rule:rgba(241,233,216,.10);
    --ink:#F1E9D8; --ink-2:#B4A994; --edge:#71685A; --shadow:#000;
    --orange:#F0703A; --blue:#79A2E6; --green:#63B583; --ochre:#E5B442; --red:#EE6A5A;
    --on-accent:#1A1612; --sel:rgba(240,112,58,.18); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --board:#191713; --hole:rgba(0,0,0,.55);
  --paper:#26231D; --paper-2:#2F2B24; --rule:rgba(241,233,216,.10);
  --ink:#F1E9D8; --ink-2:#B4A994; --edge:#71685A; --shadow:#000;
  --orange:#F0703A; --blue:#79A2E6; --green:#63B583; --ochre:#E5B442; --red:#EE6A5A;
  --on-accent:#1A1612; --sel:rgba(240,112,58,.18); color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background-color:var(--board); color:var(--ink);
  background-image:radial-gradient(circle at 50% 50%, var(--hole) 0 2px, transparent 2.6px);
  background-size:24px 24px; background-attachment:fixed;
  font:16px/1.5 var(--f-body); -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.12}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.muted{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}

/* shell */
.shell{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(120px + env(safe-area-inset-bottom,0px))}
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;flex-direction:column;min-width:0}
.logo{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:-.01em}
.logo b{font-weight:400;color:var(--orange)}
.brand .mono{color:var(--ink-2);margin-top:4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mast-act{display:flex;gap:8px;flex:none}
.icon-btn{position:relative;width:44px;height:44px;border-radius:10px;border:2px solid var(--edge);background:var(--paper);box-shadow:2px 2px 0 var(--shadow);display:grid;place-items:center;transition:transform .12s, box-shadow .12s}
.icon-btn:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow)}
.icon-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--orange);color:var(--on-accent);font:700 11px/20px var(--f-mono);border:2px solid var(--edge)}

/* panels */
.panel{background:var(--paper);border:2px solid var(--edge);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow);padding:18px;min-width:0}
.panel + .panel{margin-top:18px}
.grid2{display:grid;gap:18px;align-items:start}
.grid2 > *{min-width:0}
.grid2 > .stack{display:flex;flex-direction:column;gap:18px}
.grid2 > .stack > .panel + .panel{margin-top:0}
@media (min-width:900px){
  .grid2{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  .grid2.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.tape{display:inline-block;background:var(--ochre);color:#1E1B16;font:700 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px 5px;transform:rotate(-1.5deg);border:1.5px solid #1E1B16;box-shadow:2px 2px 0 var(--shadow)}

/* stamps */
.stamp{display:inline-block;font:700 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;border:1.5px solid currentColor;border-radius:3px;padding:4px 6px 3px;transform:rotate(-2deg);white-space:nowrap}
.st-late{color:var(--red)} .st-now{color:var(--orange)} .st-soon{color:var(--ink-2)} .st-ok{color:var(--green)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:9px;border:2px solid var(--edge);background:var(--paper);box-shadow:3px 3px 0 var(--shadow);font-weight:700;font-size:15px;text-decoration:none;transition:transform .12s, box-shadow .12s;position:relative}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.primary{background:var(--orange);color:var(--on-accent)}
.btn.ink{background:var(--ink);color:var(--paper)}
.btn.danger{color:var(--red)}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px;box-shadow:2px 2px 0 var(--shadow)}
.btn.block{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.link{background:none;border:0;padding:6px 0;font-weight:700;color:var(--orange);text-decoration:underline;text-underline-offset:3px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:7px 14px;border-radius:999px;border:2px solid var(--edge);background:var(--paper);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:background .12s, transform .1s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip svg{width:18px;height:18px}
.chip .ct{font:700 11px/1 var(--f-mono);opacity:.75}

/* task cards */
.tasks{display:flex;flex-direction:column;gap:12px}
.task{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 52px;gap:12px;align-items:start;background:var(--paper);border:2px solid var(--edge);border-radius:var(--r);padding:14px;box-shadow:3px 3px 0 var(--shadow);cursor:pointer;transition:transform .15s}
.task:hover{transform:translate(-1px,-1px)}
.task .app{font-size:13px;color:var(--ink-2);font-weight:600}
.task h3{font-size:19px;margin:2px 0 6px}
.task .why{font-size:14px;color:var(--ink-2);margin-bottom:8px}
.tile{width:48px;height:48px;border-radius:8px;border:2px solid var(--edge);display:grid;place-items:center;color:#fff}
.tile svg{width:28px;height:28px}
.c-sys{--cat:var(--blue)} .c-kit{--cat:var(--green)} .c-ext{--cat:var(--ochre)} .c-safe{--cat:var(--red)}
.tile{background:var(--cat)}
.c-ext .tile{color:#1E1B16}
.check{width:52px;height:52px;border-radius:10px;border:2.5px solid var(--edge);background:var(--paper-2);display:grid;place-items:center;transition:background .15s, transform .1s}
.check svg{width:28px;height:28px;opacity:.18;transition:opacity .15s}
.check:hover svg{opacity:.5}
.check:active{transform:scale(.92)}
.task.stamped .check{background:var(--green);color:#fff}
.task.stamped .check svg{opacity:1}
.task .slam{position:absolute;right:76px;top:50%;font:700 22px/1 var(--f-mono);letter-spacing:.12em;color:var(--green);border:3px solid var(--green);border-radius:5px;padding:6px 10px 4px;opacity:0;transform:translateY(-50%) rotate(-8deg) scale(2);pointer-events:none}
.task.stamped .slam{animation:slam .35s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes slam{to{opacity:.92;transform:translateY(-50%) rotate(-8deg) scale(1)}}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 2px;border-bottom:1.5px dashed var(--rule);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .t{font-weight:600;line-height:1.3}
.row .s{font-size:13px;color:var(--ink-2)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--cat);border:1.5px solid var(--edge)}
.datecell{font:600 12px/1.1 var(--f-mono);text-align:center;width:42px;text-transform:uppercase;letter-spacing:.06em}
.datecell b{display:block;font-size:20px;font-family:var(--f-display);font-weight:400;letter-spacing:0}

/* today hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hero h1{font-size:clamp(38px,9vw,56px)}
.count{font:400 64px/0.9 var(--f-display);color:var(--orange)}
.notice{display:flex;gap:12px;align-items:center;justify-content:space-between;border:2px dashed var(--orange);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;background:var(--sel);flex-wrap:wrap}
.notice p{font-weight:600;font-size:15px;min-width:0;flex:1 1 200px}
.empty{text-align:center;padding:28px 12px}
.empty h3{font-size:24px;margin:10px 0 6px}
.empty p{color:var(--ink-2);max-width:40ch;margin:0 auto 16px}

/* inventory */
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.prop h1{font-size:clamp(30px,7vw,40px)}
.facts{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:700px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1000px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.card{display:flex;flex-direction:column;text-align:left;background:var(--paper);border:2px solid var(--edge);border-radius:var(--r);box-shadow:3px 3px 0 var(--shadow);padding:0;overflow:hidden;transition:transform .15s;min-width:0}
.card:hover{transform:translate(-1px,-1px) rotate(-.4deg)}
.card .ph{aspect-ratio:4/3;max-width:100%;background:var(--cat);border-bottom:2px solid var(--edge);display:grid;place-items:center;color:#fff;position:relative}
.c-ext.card .ph{color:#1E1B16}
.card .ph svg{width:46%;height:46%}
.card .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card .nm{font-family:var(--f-display);font-size:17px;line-height:1.15;overflow-wrap:anywhere}
.card .nx{font-size:13px;color:var(--ink-2);line-height:1.35}
.card.new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.03)}100%{transform:none}}

/* atlas */
.dial{display:block;width:100%;max-width:520px;height:auto;margin:0 auto;touch-action:manipulation}
.dial text{fill:var(--ink);font-family:var(--f-mono)}
.d-face{fill:var(--paper);stroke:var(--edge);stroke-width:2.5}
.d-ring{fill:none;stroke:var(--rule);stroke-width:1.2;stroke-dasharray:2 4}
.d-tick{stroke:var(--edge);stroke-width:1.2;opacity:.45}
.sec{fill:transparent;cursor:pointer;transition:fill .15s}
.sec:hover{fill:var(--sel)}
.sec.on{fill:var(--sel)}
.sec:focus-visible{outline:none;fill:var(--sel);stroke:var(--orange);stroke-width:2}
.season{opacity:.22}
.d-dot{stroke:var(--edge);stroke-width:1.6;pointer-events:none;transition:r .2s}
.d-dot.late{stroke:var(--red);stroke-width:3}
.d-needle{stroke:var(--orange);stroke-width:3;stroke-linecap:round}
.d-hub{fill:var(--paper);stroke:var(--edge);stroke-width:2.5}
.d-mlabel{font-size:12px;font-weight:600;letter-spacing:.06em}
.d-mlabel.on{fill:var(--orange)}
.d-center-m{font-family:var(--f-display)!important;font-size:30px}
.d-center-c{font-size:11px;letter-spacing:.1em}
.atlas-meta{display:flex;flex-wrap:wrap;gap:8px 16px;margin:4px 0 14px;color:var(--ink-2);font-size:14px}
.monthstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;margin-top:14px;scrollbar-width:thin}
.mchip{flex:none;min-width:54px;padding:6px 8px;border:2px solid var(--edge);border-radius:8px;background:var(--paper);text-align:center;font:600 12px/1.2 var(--f-mono);text-transform:uppercase}
.mchip b{display:block;font-family:var(--f-display);font-weight:400;font-size:18px}
.mchip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.bar{height:4px;margin-top:4px;border-radius:2px;background:var(--orange);opacity:.8}

/* ledger */
.ledger{background-image:repeating-linear-gradient(to bottom, transparent 0 43px, var(--rule) 43px 44px)}
.lg-month{font:700 12px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--orange);padding:16px 0 6px}
.lg-month:first-child{padding-top:0}
.cert{position:relative;border-style:double;border-width:5px}
.cert h2{font-size:28px;margin:8px 0 4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.stat{border:2px solid var(--edge);border-radius:6px;padding:10px;text-align:center;background:var(--paper-2)}
.stat b{display:block;font:400 28px/1.1 var(--f-display)}
.stat span{font:600 10px/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.seal{position:absolute;top:14px;right:14px;width:74px;height:74px;border-radius:50%;border:2.5px solid var(--green);color:var(--green);display:grid;place-items:center;text-align:center;font:700 9px/1.2 var(--f-mono);letter-spacing:.08em;transform:rotate(12deg);text-transform:uppercase}
.report{font-size:14px}
.report h3{font-size:18px;margin:16px 0 4px}
.report .rl{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--rule)}
.report .rl .mono{flex:none;width:92px;font-size:11px;padding-top:3px}
.copybox{width:100%;min-height:160px;font:12px/1.5 var(--f-mono);border:2px solid var(--edge);border-radius:6px;background:var(--paper-2);padding:10px;margin-top:12px}

/* tab bar */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(460px, calc(100% - 32px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;background:var(--paper);border:2px solid var(--edge);border-radius:16px;box-shadow:4px 4px 0 var(--shadow);z-index:20}
.tabbar button{border:0;background:none;border-radius:11px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px/1.1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);transition:background .18s, color .18s}
.tabbar svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{background:var(--ink);color:var(--paper)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--edge);border-bottom:0;border-radius:16px 16px 0 0;z-index:41;animation:up .26s cubic-bezier(.2,.9,.3,1)}
.sheet-body{overflow-y:auto;padding:6px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.grab{width:44px;height:5px;border-radius:3px;background:var(--edge);opacity:.5;margin:10px auto 6px;flex:none}
.sheet-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sheet-top h2{font-size:26px}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px,calc(100% - 48px));transform:translate(-50%,-50%);border-bottom:2px solid var(--edge);border-radius:12px;box-shadow:6px 6px 0 var(--shadow);animation:fade .2s}
  .sheet-body{padding:6px 24px 24px}
  .grab{display:none}
}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field > label, .field > .lbl{font:700 11px/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.inp{min-height:46px;width:100%;padding:10px 12px;border:2px solid var(--edge);border-radius:8px;background:var(--paper-2);font-size:16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pair > *{min-width:0}
.photo{position:relative;aspect-ratio:2/1;max-width:100%;border:2px solid var(--edge);border-radius:8px;background:var(--cat);display:grid;place-items:center;color:#fff;overflow:hidden;margin-bottom:10px}
.c-ext .photo{color:#1E1B16}
.photo svg{width:72px;height:72px}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.plan{border:2px solid var(--edge);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--paper-2)}
.plan.off{opacity:.55}
.plan-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.plan-h h3{font-size:17px}
.switch{flex:none;width:52px;height:30px;border-radius:15px;border:2px solid var(--edge);background:var(--paper);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--green)}
.switch[aria-checked="true"]::after{transform:translateX(22px);background:#fff}
.confirm{border:2px dashed var(--red);border-radius:8px;padding:12px;margin-top:10px}
.confirm p{font-weight:600;margin-bottom:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:10px}
.addgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.addgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.addbtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border:2px solid var(--edge);border-radius:9px;background:var(--paper);text-align:left;font-weight:600;font-size:14px;line-height:1.2;box-shadow:2px 2px 0 var(--shadow);transition:transform .1s;min-width:0}
.addbtn:active{transform:translate(2px,2px);box-shadow:none}
.addbtn .tile{width:36px;height:36px;flex:none;border-width:1.5px}
.addbtn .tile svg{width:22px;height:22px}
.addbtn .cnt{margin-left:auto;font:700 11px/1 var(--f-mono);color:var(--orange)}
.addbtn span:not(.tile):not(.cnt){min-width:0;overflow-wrap:anywhere}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--paper);border-radius:10px;padding:10px 12px 10px 16px;z-index:60;box-shadow:3px 3px 0 var(--orange);animation:toast .3s cubic-bezier(.2,1.3,.4,1);font-weight:600;font-size:15px}
.toast svg{width:20px;height:20px;color:var(--green);flex:none}
.toast button{background:none;border:2px solid var(--paper);color:var(--paper);border-radius:7px;padding:5px 10px;font:700 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
@keyframes toast{from{transform:translate(-50%,20px);opacity:0}}

/* onboarding */
.onb{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.cover{padding:26px 22px}
.cover .mono{color:var(--orange)}
.cover h1{font-size:clamp(34px,8.5vw,50px);margin:14px 0 12px}

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P_=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]);};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=P_(s);d.setDate(d.getDate()+n);return iso(d);};
const addMonths=(s,n)=>{const d=P_(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,dim));return iso(d);};
const days=(a,b)=>Math.round((P_(b)-P_(a))/864e5);
const maxD=(a,b)=>a>b?a:b;
const fmt=s=>{const d=P_(s);return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;};
const fmtMY=s=>{const d=P_(s);return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;};
function nextAnchor(s,anchors,inclusive){
  const d=P_(s);
  for(let i=0;i<30;i++){
    const m=new Date(d.getFullYear(),d.getMonth()+i,1);
    if(anchors.includes(m.getMonth()+1)){
      if(i===0){ if(inclusive) return s; continue; }
      return iso(m);
    }
  }
  return addMonths(s,12);
}
function every(task,tp){ return tp.anchors? null : (task.every||tp.every); }
function intervalLabel(task,tp){
  if(tp.anchors) return tp.anchors.length===1? `Every ${MONTHS_L[tp.anchors[0]-1]}` : "Every "+tp.anchors.map(m=>MONTHS_L[m-1]).join(" & ");
  return optLabel(every(task,tp));
}
function optLabel(n){ if(n===1) return "Monthly"; if(n===12) return "Yearly"; if(n%12===0) return `Every ${n/12} years`; return `Every ${n} months`; }
function optShort(n){ if(n===1) return "1 mo"; if(n%12===0) return `${n/12} yr`; return `${n} mo`; }
function dueInfo(due){
  const d=days(today(),due);
  if(d<0) return {cls:"st-late",txt:`Overdue ${-d} d`,late:true};
  if(d===0) return {cls:"st-now",txt:"Due today",now:true};
  if(d===1) return {cls:"st-soon",txt:"Tomorrow"};
  if(d<=13) return {cls:"st-soon",txt:`In ${d} days`};
  if(d<=60) return {cls:"st-soon",txt:`In ${Math.round(d/7)} wks`};
  return {cls:"st-soon",txt:fmtMY(due)};
}

}

/* ---------- domain ---------- */
function planTasks(a){
  const ty=typeOf(a), t0=today(), out=[];
  ty.tasks.forEach(tp=>{
    if(S.tasks.some(x=>x.aid===a.id&&x.k===tp.k)) return; // never duplicate a planned task
    const due=tp.anchors? nextAnchor(t0,tp.anchors,true) : addDays(t0,tp.first||0);
    const t={id:uid(),aid:a.id,k:tp.k,every:tp.every||null,due,last:null,on:true};
    S.tasks.push(t); out.push(t);
  });
  return out;
}
function addApp(type){
  const ty=TYPES[type];

function advance(t,tp){

function undoEntry(hid,quiet){
  const h=S.hist.find(x=>x.id===hid); if(!h) return;
  const t=task(h.tid);
  const latest=S.hist.filter(x=>x.tid===h.tid).sort((x,y)=>x.date<y.date?1:-1)[0];

  return out;
}
function occurrences(){
  const now=new Date(), w0=iso(new Date(now.getFullYear(),now.getMonth(),1)), w1=iso(new Date(now.getFullYear(),now.getMonth()+12,1)), t0=today();
  const out=[];
  activeTasks().forEach(t=>{
    const tp=tpl(t), a=app(t.aid); let d=t.due, n=0, first=true;
    while(d<w1&&n<40){
      const shown=d<w0? t0 : d;
      const dd=P_(shown), mi=(dd.getFullYear()-now.getFullYear())*12+dd.getMonth()-now.getMonth();
      if(mi>=0&&mi<12) out.push({t,tp,a,date:shown,mi,first,late:t.due<t0&&first,cat:typeOf(a).cat});
      d=tp.anchors? nextAnchor(d,tp.anchors,false) : addMonths(d,every(t,tp));
      n++; first=false;
    }
  });
  return out.sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:0);
}

function dial(occ,mdate){
  const C=200,R0=66,R1=168, ring={safe:154,ext:132,kit:110,sys:88};
  const pt=(r,a)=>{const rad=a*Math.PI/180;return [(C+r*Math.cos(rad)).toFixed(2),(C+r*Math.sin(rad)).toFixed(2)];};
  const seasonOf=mo=>[11,0,1].includes(mo)?"var(--blue)":[2,3,4].includes(mo)?"var(--green)":[5,6,7].includes(mo)?"var(--ochre)":"var(--orange)";
  let s=`<svg class="dial" viewBox="0 0 400 400" role="group" aria-label="Twelve-month maintenance dial. Select a month to list its jobs.">`;
  s+=`<circle class="d-face" cx="200" cy="200" r="197"/>`;
  for(let i=0;i<12;i++){
    const a0=-90+i*30,a1=a0+30, mo=mdate(i).getMonth();
    const [x0,y0]=pt(196,a0),[x1,y1]=pt(196,a1),[x2,y2]=pt(R1+3,a1),[x3,y3]=pt(R1+3,a0);
    s+=`<path class="season" fill="${seasonOf(mo)}" d="M${x0} ${y0}A196 196 0 0 1 ${x1} ${y1}L${x2} ${y2}A${R1+3} ${R1+3} 0 0 0 ${x3} ${y3}Z"/>`;
  }
  Object.values(ring).forEach(r=>{s+=`<circle class="d-ring" cx="200" cy="200" r="${r}"/>`;});
  for(let i=0;i<12;i++){
    const a0=-90+i*30,a1=a0+30, d=mdate(i), n=occ.filter(o=>o.mi===i).length;
    const [x0,y0]=pt(R1,a0),[x1,y1]=pt(R1,a1),[x2,y2]=pt(R0,a1),[x3,y3]=pt(R0,a0);
    s+=`<path class="sec${ui.atlasMonth===i?" on":""}" data-a="atlas-month" data-m="${i}" tabindex="0" role="button" aria-label="${MONTHS_L[d.getMonth()]} ${d.getFullYear()}, ${n} job${n===1?"":"s"}" d="M${x0} ${y0}A${R1} ${R1} 0 0 1 ${x1} ${y1}L${x2} ${y2}A${R0} ${R0} 0 0 0 ${x3} ${y3}Z"/>`;
    const [tx,ty]=pt(R1,a0),[ux,uy]=pt(197,a0);
    s+=`<line class="d-tick" x1="${tx}" y1="${ty}" x2="${ux}" y2="${uy}"/>`;
    const [lx,ly]=pt(183,a0+15);
    const lab=MONTHS[d.getMonth()].toUpperCase();
    s+=`<text class="d-mlabel${ui.atlasMonth===i?" on":""}" x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central" >${lab}</text>`;
  }
  const groups={};
  occ.forEach(o=>{ if(ui.hide[o.cat]) return; const k=o.mi+"|"+o.cat; (groups[k]=groups[k]||[]).push(o); });
  Object.keys(groups).forEach(k=>{
    const g=groups[k], mi=+k.split("|")[0], r=ring[g[0].cat], n=g.length;
    const rad=n>4?4.6:6;
    g.forEach((o,j)=>{
      const a=-90+mi*30+30*(j+1)/(n+1);
      const [x,y]=pt(r,a);
      s+=`<circle class="d-dot${o.late?" late":""}" cx="${x}" cy="${y}" r="${rad}" fill="var(--${({sys:"blue",kit:"green",ext:"ochre",safe:"red"})[o.cat]})"/>`;
    });
  });
  const now=new Date(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const na=-90+((now.getDate()-1)/dim)*30;
  const [n0x,n0y]=pt(R0,na),[n1x,n1y]=pt(R1+2,na),[nhx,nhy]=pt(R1+9,na);
  s+=`<line class="d-needle" x1="${n0x}" y1="${n0y}" x2="${n1x}" y2="${n1y}"/><circle cx="${nhx}" cy="${nhy}" r="4.5" fill="var(--orange)"/>`;
  const md=mdate(ui.atlasMonth), cnt=occ.filter(o=>o.mi===ui.atlasMonth&&!ui.hide[o.cat]).length;
  s+=`<circle class="d-hub" cx="200" cy="200" r="${R0-6}"/>`;
  s+=`<text class="d-center-m" x="200" y="194" text-anchor="middle">${MONTHS[md.getMonth()]}</text>`;
  s+=`<text class="d-center-c" x="200" y="218" text-anchor="middle">${cnt} JOB${cnt===1?"":"S"}</text>`;
  return s+`</svg>`;
}

function reportText(){
  const p=S.property, L=[];
  L.push(`HOME SERVICE RECORD: ${p.nick}`);
  L.push([htName(p.type),p.year?`Built ${p.year}`:null,p.address].filter(Boolean).join(" · "));
  L.push(`Record opened ${fmt(p.opened||today())} · Generated ${fmt(today())}`);
  L.push(`${S.hist.length} services logged across ${S.apps.length} items`);
  L.push("");
  reportData().forEach(g=>{
    L.push(g.name.toUpperCase()+(g.app&&appFacts(g.app)?`  (${appFacts(g.app)})`:""));
    if(!g.items.length) L.push("  No service logged yet");
    g.items.forEach(h=>L.push(`  ${fmt(h.date)}  ${h.title}${h.by?` (${h.by==="pro"?"professional":"owner"})`:""}`));
    L.push("");
  });
  L.push("Entries are logged by the homeowner in HomeIQ.");
  return L.join("\n");
}
function reportHTML(){
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home Service Record: ${esc(S.property.nick)}</title><style>body{font:15px/1.5 Georgia,serif;max-width:720px;margin:40px auto;padding:0 20px;color:#1e1b16;background:#fff}h1{font-weight:400;font-size:32px;margin:0}h2{font-weight:400;font-size:20px;margin:28px 0 4px;border-bottom:2px solid #1e1b16;padding-bottom:4px}.m{font:12px/1.4 Menlo,monospace;letter-spacing:.06em;text-transform:uppercase;color:#5b5346}li{margin:2px 0}</style></head><body><pre style="white-space:pre-wrap;font:inherit">${esc(reportText())}</pre></body></html>`;
}

/* ---------- sheets ---------- */
function openSheet(s,id){ ui.sheet=s; ui.sid=id||null; ui.confirm=null; ui.copyText=null; if(s==="reminders"){ S.rem.seen=today(); save(); render(); } else renderLayer(true); }
function closeSheet(){ ui.sheet=null; ui.sid=null; ui.confirm=null; renderLayer(); if(lastFocus&&document.contains(lastFocus)) lastFocus.focus(); }
let lastFocus=null;
function renderLayer(focus){
  const L=document.getElementById("layer");
  if(!ui.sheet){ L.innerHTML=""; document.body.style.overflow=""; return; }
  const prev=L.querySelector(".sheet-body"), st=prev?prev.scrollTop:0;
  let html="";
  try{ html=({add:sAdd,app:sApp,task:sTask,property:sProperty,reminders:sReminders,report:sReport,entry:sEntry})[ui.sheet](); }catch(e){ html=null; }
  if(html==null){ ui.sheet=null; L.innerHTML=""; document.body.style.overflow=""; return; }
  L.innerHTML=`<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"><div class="grab"></div><div class="sheet-body">${html}</div></div>`;
  document.body.style.overflow="hidden";
  const b=L.querySelector(".sheet-body"); if(b) b.scrollTop=st;
  if(focus){ const h=L.querySelector("#sheet-h"); if(h){h.setAttribute("tabindex","-1");h.focus({preventScroll:true});} }
}
const sheetTop=(title,sub)=>`<div class="sheet-top"><div style="min-width:0">${sub?`<span class="mono muted">${sub}</span>`:""}<h2 id="sheet-h">${title}</h2></div><button class="icon-btn" data-a="close" aria-label="Close">${ico("close",2.2)}</button></div>`;

/* ---------- photos ---------- */
function readPhoto(file,cb){
  const fr=new FileReader();
  fr.onload=()=>{ const img=new Image(); img.onload=()=>{
      const M=720, k=Math.min(1,M/Math.max(img.width,img.height)), c=document.createElement("canvas");
      c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      cb(c.toDataURL("image/jpeg",.72)); };
    img.onerror=()=>cb(null); img.src=fr.result; };
  fr.onerror=()=>cb(null);
  fr.readAsDataURL(file);
}

/* ---------- actions ---------- */
function finishOnboarding(load){
  const o=ui.onb;
  S.property={nick:NICKS[o.type]||"My Home",type:o.type,year:o.year||"",address:"",opened:today()};
  S.onboarded=true;
  if(load) o.pick.forEach(k=>addApp(k));
  save(); ui.tab="today"; render(); window.scrollTo(0,0);
  if(load) toast(`${o.pick.length} items added · ${S.tasks.length} tasks planned`,null);
}
function act(a,el){
  const id=el.dataset.id, v=el.dataset.v;
  switch(a){
    case "tab": ui.tab=el.dataset.t; closeSheet(); render(); window.scrollTo(0,0); break;
    case "sheet": lastFocus=lastFocus&&ui.sheet?lastFocus:el; openSheet(el.dataset.s,id); break;
    case "close": closeSheet(); break;
    case "undo": if(ui.toast&&ui.toast.undo){ const u=ui.toast.undo; ui.toast=null; document.getElementById("toast-root").innerHTML=""; u(); } break;
    case "onb-type": ui.onb.type=v; ui.onb.pick=STARTER[v].slice(); ui.onb.step=2; render(); window.scrollTo(0,0); break;
    case "onb-pick": { const p=ui.onb.pick, i=p.indexOf(v); i>=0?p.splice(i,1):p.push(v); render(); break; }
    case "onb-back": ui.onb.step=1; render(); break;
    case "onb-load": finishOnboarding(true); break;
    case "onb-empty": finishOnboarding(false); break;
    case "done": {
      const card=document.getElementById("tk-"+id);
      if(card&&!card.classList.contains("stamped")){ card.classList.add("stamped"); setTimeout(()=>{complete(id);render();},matchMedia("(prefers-reduced-motion: reduce)").matches?0:520); }
      break; }
    case "done-plain": complete(id); render(); break;
    case "done-sheet": complete(id); render(); break;
    case "snooze": { const t=task(id); t.due=addDays(maxD(today(),t.due),7); save(); render(); toast("Snoozed for a week",null); break; }
    case "skip": { const t=task(id),prev=t.due; t.due=advance(t,tpl(t)); save(); render(); toast(`Skipped · next ${fmt(t.due)}`,()=>{t.due=prev;save();render();}); break; }
    case "task-on": { const t=task(id); t.on=!t.on; if(t.on&&t.due<today()) t.due=today(); save(); render(); break; }
    case "task-every": { const t=task(id), tp=tpl(t), n=+v; const base=t.last||null; t.every=n; t.due=base? maxD(today(),addMonths(base,n)) : t.due; save(); render(); break; }
    case "undo-entry": undoEntry(id,true); toast("Completion undone",null); break;
    case "add-type": { const r=addApp(v); ui.fresh=r.a.id; save(); render(); toast(`${r.a.name} added · ${r.ts.length} task${r.ts.length===1?"":"s"} planned`,()=>removeApp(r.a.id,true)); break; }
    case "app-remove": ui.confirm="app"; renderLayer(); break;
    case "app-remove-yes": removeApp(id); break;
    case "confirm-no": ui.confirm=null; renderLayer(); break;
    case "photo-remove": { const x=app(id), old=x.photo; x.photo=null; save(); render(); toast("Photo removed",()=>{x.photo=old;save();render();}); break; }
    case "war-quick": { const x=app(id); x.warranty=addMonths(x.installed||today(),12*(+v)); save(); render(); break; }
    case "war-clear": app(id).warranty=""; save(); render(); break;
    case "atlas-month": ui.atlasMonth=+el.dataset.m; render(); break;
    case "atlas-cat": ui.hide[v]=!ui.hide[v]; render(); break;
    case "entry-by": { const h=S.hist.find(x=>x.id===id); h.by=h.by===v?null:v; save(); render(); break; }
    case "entry-remove": ui.confirm="entry"; renderLayer(); break;
    case "entry-remove-yes": { ui.sheet=null; undoEntry(id,false); break; }
    case "copy-report": copyReport(); break;
    case "dl-report": downloadReport(); break;
    case "prop-nick": S.property.nick=v; save(); render(); break;
    case "prop-type": S.property.type=v; save(); render(); break;
    case "rem-on": S.rem.on=!S.rem.on; save(); render(); break;
    case "rem-lead": S.rem.lead=+v; save(); render(); break;
    case "reset": ui.confirm="reset"; renderLayer(); break;
    case "reset-yes": try{localStorage.removeItem(KEY);}catch(e){} S=blank(); ui.sheet=null; ui.onb={step:1,type:null,year:"",pick:[]}; ui.tab="today"; render(); break;
  }
}
function removeApp(id,quiet){
  const a=app(id); if(!a) return;
  const snapA=a, snapT=S.tasks.filter(t=>t.aid===id), idx=S.apps.indexOf(a);
  S.apps=S.apps.filter(x=>x.id!==id); S.tasks=S.tasks.filter(t=>t.aid!==id);
  if(ui.sheet==="app"&&ui.sid===id) ui.sheet=null;
  ui.confirm=null; save(); render();
  if(!quiet) toast(`${snapA.name} removed`,()=>{ S.apps.splice(idx,0,snapA); S.tasks.push(...snapT); save(); render(); });
}
function copyReport(){
  const txt=reportText();
  const fallback=()=>{ ui.sheet="report"; ui.copyText=txt; renderLayer(); const b=document.getElementById("copybox"); if(b){ b.focus(); b.select(); b.scrollIntoView({block:"nearest"}); } toast("Select the text below to copy it",null); };
  try{ navigator.clipboard.writeText(txt).then(()=>toast("Report copied",null),fallback); }catch(e){ fallback(); }
}
function downloadReport(){
  const blob=new Blob([reportHTML()],{type:"text/html"}), u=URL.createObjectURL(blob), l=document.createElement("a");
  l.href=u; l.download=`home-record-${S.property.nick.toLowerCase().replace(/[^a-z0-9]+/g,"-")}.html`;
  document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function onChange(c,el){
  const id=el.dataset.id;
  switch(c){
    case "onb-year": ui.onb.year=el.value; break;
    case "app-f": {
      const a=app(id), f=el.dataset.f; let val=el.value.trim();
      if(f==="name"&&!val) val=typeOf(a).n;
      a[f]=val;
      if(f==="installed"&&val){ S.tasks.filter(t=>t.aid===id&&!t.last).forEach(t=>{ const tp=tpl(t); if(tp.life){ t.due=maxD(today(),addMonths(val,every(t,tp))); } }); }
      save(); render(); break; }
    case "photo": {
      const f=el.files&&el.files[0]; if(!f) return;
      readPhoto(f,url=>{
        if(!url){ toast("That file isn't an image we can read",null); return; }
        const a=app(id), old=a.photo; a.photo=url;
        if(!save()){ a.photo=old; toast("Not enough space on this device for that photo",null); return; }
        render(); toast("Photo saved",null);
      }); break; }
    case "task-due": if(el.value){ task(id).due=el.value; save(); render(); } break;
    case "entry-date": if(el.value){ const h=S.hist.find(x=>x.id===id); h.date=el.value; save(); render(); } break;
    case "prop-year": S.property.year=el.value; save(); render(); break;
    case "prop-addr": S.property.address=el.value.trim(); save(); render(); break;
    case "prop-nick-custom": if(el.value.trim()){ S.property.nick=el.value.trim(); save(); render(); } break;
  }
}

document.addEventListener("click",e=>{ const el=e.target.closest("[data-a]"); if(!el||el.disabled) return; act(el.dataset.a,el); });
document.addEventListener("change",e=>{ const el=e.target.closest("[data-c]"); if(el) onChange(el.dataset.c,el); });
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&ui.sheet){ closeSheet(); return; }
  if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"]:not(button), article[data-a]')){ e.preventDefault(); e.target.click(); }
});
render();
})();
</script>
</body>
</html>
